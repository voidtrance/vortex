name: vortex-build-install-deps
description: Install all build dependencies
outputs:
    vortex-version:
      value: ${{ steps.vortex-version.outputs.vortex-version }} 
    vortex-arch:
      value: ${{ steps.vortex-arch.outputs.vortex-arch }}
runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'
    - name: Get Version
      id: vortex-version
      shell: bash
      run: echo "vortex-version=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
    - name: Get Arch
      id: vortex-arch
      shell: bash
      run: echo "vortex-arch=$(uname -m)" >> $GITHUB_OUTPUT
    - name: Install dependencies
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y meson libgirepository-2.0-dev libcairo2-dev
        python -m pip install --upgrade pip setuptools wheel flake8 meson
        pip install -r virtualenv.txt
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@v2
      with:
        version: "21.1.8"
        env: 1
    - name: Install Python Dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install clang clang-format
    - name: Setup Environment
      shell: bash
      run: |
        echo CLANG_INCLUDE_PATH=$(llvm-config --includedir) >> $GITHUB_ENV
        echo LIBRARY_PATH=$(llvm-config --libdir) >> $GITHUB_ENV
        echo LLVM_CFLAGS=$(llvm-config --cflags) >> $GITHUB_ENV
        echo CC=clang >> $GITHUB_ENV